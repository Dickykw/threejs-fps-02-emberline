<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERLINE — Foundry Yard</title>
<style>
  :root { --gap: 6px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1210; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; color: #e8ddc9; }
  #game { display: block; width: 100%; height: 100%; }
  .hidden { display: none !important; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  /* Top bar: alive dots, score, timer, round. */
  #topbar { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; font-weight: 600; text-shadow: 0 1px 3px #000; }
  #topbar .score { font-size: 26px; letter-spacing: 1px; }
  #topbar .score .e { color: #35c4b5; }
  #topbar .score .s { color: #ff5a4a; }
  #timer { font-size: 26px; font-variant-numeric: tabular-nums; }
  #timer.low { color: #ff5a4a; }
  #round-num { font-size: 12px; letter-spacing: 2px; color: #9a8a72; }
  .dots { display: flex; gap: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4a3a2c; display: inline-block; }
  /* Crosshair. */
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #crosshair .l { position: absolute; background: #e8ddc9; box-shadow: 0 0 2px #000; }
  #crosshair .t { left: -1px; top: calc(-1 * var(--gap) - 8px); width: 2px; height: 8px; }
  #crosshair .b { left: -1px; top: var(--gap); width: 2px; height: 8px; }
  #crosshair .lf { top: -1px; left: calc(-1 * var(--gap) - 8px); height: 2px; width: 8px; }
  #crosshair .r { top: -1px; left: var(--gap); height: 2px; width: 8px; }
  #crosshair .d { left: -1px; top: -1px; width: 2px; height: 2px; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; }
  #hitmarker.show { opacity: 1; }
  #hitmarker::before, #hitmarker::after { content: ''; position: absolute; left: 50%; top: 50%; width: 26px; height: 2px; background: #fff; transform: translate(-50%, -50%) rotate(45deg); }
  #hitmarker::after { transform: translate(-50%, -50%) rotate(-45deg); }
  #hitmarker.kill::before, #hitmarker.kill::after { background: #ff5a4a; height: 3px; }
  /* Bottom-left: health. */
  #health { position: absolute; left: 22px; bottom: 20px; }
  #hp-bar-wrap { width: 190px; height: 10px; background: #0009; border: 1px solid #6a5a44; }
  #hp-fill { height: 100%; width: 100%; background: #35c4b5; transition: width .15s; }
  #hp-num { font-size: 22px; font-weight: 700; }
  #armor-num { color: #ffb347; font-size: 14px; margin-left: 6px; }
  /* Bottom-right: ammo + money. */
  #ammo { position: absolute; right: 24px; bottom: 18px; text-align: right; text-shadow: 0 1px 3px #000; }
  #ammo-mag { font-size: 38px; font-weight: 700; line-height: 1; }
  #ammo-res { font-size: 16px; color: #9a8a72; }
  #weapon-name { font-size: 13px; letter-spacing: 2px; color: #cbb98f; }
  #money { font-size: 18px; color: #ffb347; font-weight: 700; margin-top: 2px; }
  /* Kill feed. */
  #killfeed { position: absolute; top: 56px; right: 20px; text-align: right; font-size: 13px; }
  #killfeed .kf { background: #000a; padding: 3px 8px; margin-top: 4px; border-radius: 3px; }
  /* Bomb status + plant bar. */
  #bomb-status { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); color: #ff5a4a; font-weight: 700; letter-spacing: 1px; font-size: 15px; }
  #bomb-status.hot { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  #plant-bar { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); width: 240px; height: 12px; background: #000a; border: 1px solid #ffb347; }
  #plant-fill { height: 100%; width: 0%; background: #ffb347; }
  /* Round banner. */
  #banner { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); text-align: center; opacity: 0; transition: opacity .25s; }
  #banner.show { opacity: 1; }
  #banner-text { font-size: 44px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 2px 8px #000; }
  #banner-sub { font-size: 15px; color: #cbb98f; margin-top: 4px; }
  /* Buy menu. */
  #buy-menu { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 460px; background: #14100cd9; border: 1px solid #6a5a44; border-radius: 8px; padding: 18px; pointer-events: auto; }
  #buy-menu h2 { font-size: 18px; letter-spacing: 2px; }
  #buy-money { color: #ffb347; font-weight: 700; margin: 4px 0 12px; }
  .buy-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: #241b12; color: #e8ddc9; border: 1px solid #4a3a2c; border-radius: 5px; padding: 9px 10px; margin-top: 6px; cursor: pointer; font-size: 14px; }
  .buy-item:hover:not(:disabled) { border-color: #ffb347; background: #2e2214; }
  .buy-item:disabled { opacity: .45; cursor: default; }
  .buy-key { background: #3a2f26; border: 1px solid #6a5a44; border-radius: 3px; padding: 1px 7px; font-size: 12px; }
  .buy-name { font-weight: 700; }
  .buy-desc { flex: 1; color: #9a8a72; font-size: 12px; }
  .buy-price { color: #ffb347; font-weight: 700; }
  /* Start / end overlay. */
  #overlay { position: fixed; inset: 0; background: #0d0906d9; display: flex; align-items: center; justify-content: center; z-index: 10; }
  #overlay .card { width: 520px; max-width: 92vw; background: #1d150e; border: 1px solid #6a5a44; border-radius: 10px; padding: 28px; }
  #overlay-title { font-size: 40px; letter-spacing: 4px; font-weight: 800; color: #ffb347; }
  #overlay-text { margin: 12px 0 20px; line-height: 1.55; color: #d8c9a8; white-space: pre-line; }
  #overlay-btn { background: #ffb347; color: #1d150e; border: none; border-radius: 6px; padding: 12px 22px; font-size: 16px; font-weight: 700; cursor: pointer; }
  #overlay-btn:hover { background: #ffc46b; }
  #overlay-btn:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="topbar">
    <span id="alive-ember" class="dots"></span>
    <span class="score"><span class="e" id="score-ember">0</span> — <span class="s" id="score-slate">0</span></span>
    <span id="timer">1:40</span>
    <span id="round-num">ROUND 1</span>
    <span id="alive-slate" class="dots"></span>
  </div>
  <div id="crosshair"><span class="l t"></span><span class="l b"></span><span class="l lf"></span><span class="l r"></span><span class="l d"></span></div>
  <div id="hitmarker"></div>
  <div id="health">
    <div id="hp-bar-wrap"><div id="hp-fill"></div></div>
    <div><span id="hp-num">100</span><span id="armor-num"></span></div>
  </div>
  <div id="ammo">
    <div><span id="ammo-mag">12</span> <span id="ammo-res">/ 48</span></div>
    <div id="weapon-name">P9</div>
    <div id="money">$800</div>
  </div>
  <div id="killfeed"></div>
  <div id="bomb-status"></div>
  <div id="plant-bar" class="hidden"><div id="plant-fill"></div></div>
  <div id="banner"><div id="banner-text"></div><div id="banner-sub"></div></div>
  <div id="buy-menu" class="hidden">
    <h2>BUY WEAPONS</h2>
    <div id="buy-money">$800</div>
    <div id="buy-items"></div>
  </div>
</div>
<div id="overlay" class="hidden">
  <div class="card">
    <div id="overlay-title">EMBERLINE</div>
    <div id="overlay-text"></div>
    <button id="overlay-btn">Click to play</button>
  </div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
